name: Import article illustrations

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-article-images.yml']

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install PNG validation dependency
        run: python3 -m pip install 'Pillow>=10,<13'
      - name: Import the eight authorized illustrations and verify their pixels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, urllib.request
          from PIL import Image
          repo = os.environ['REPOSITORY']
          assert repo == 'except-pass/curved-transformer-spacetime-exploration'
          # Temporary URLs identify only the illustrations approved for this public article.
          # No document text, Drive metadata, or other files are fetched by this workflow.
          images = [
            ('assets/transformer-explainer.png', [1844,775], '27bfdf25d1aaa6d1c51940e1ff516895c04fb7942174eecf5028340d1ec3dd0d', 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXdWdpgmot4Oh05tGCTrDziEbnnGOGXTPSt9qdtUDkbHUOX5OgFoB5InMTxO1AyyWsGKQBnk_6tJKRQS0TVTjwtbHAmdI-TaAmjY3876WfA9pcqw_qqGBxmmQvohUKmIn-waNXiDcfMlB_tmVbCETJ8CGzuQkA7wvv6kqaPPkfLgfc-FJYY=s2048?key=KGJRlJEPx4yrODZB1IsOdA'),
            ('assets/qkv-marketplace-causal.png', [1448,1086], 'd4a5b1ddea67c9ec80c491e59e11350ef7267f388375f12a1304f0bbc540a8ee', 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXcNS4lBpe8rQeLymUVbSLFAOCfrNrjOVywNadvTHKdfNzU0VDqgM6GxjsZ327OlQ3TMrpTf_UgzyZXlw7yPF71nYOaTQlgITnWiWwXrd50C1eo05dWGqgFrgqDWufmdi7Hu9lFaYZ-hOOkvWVwuEMVq8DbZksBz1B3cNOgF727nrwWG_5A=s2048?key=KGJRlJEPx4yrODZB1IsOdA'),
            ('assets/token-through-layers.png', [1448,1086], '937471cfb61559dbe69c33728f674973c0f8d3da033714b53833800846b7336d', 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXfKN_NyL0WivrkGsfFWYOkeODwjj2e9DcCtH1s5lcV-jERqHgvEpnH0-lFpbs5jmvIjgraqKyJbaeJ1Ni2YBvo6fmNl8iJCXld5rkIjjyqOIqGEzEd7EtZej5nKvT9mG1pUEQ3P6JOpRWFAFpVZQOU6JEh6Y39-9EzU3Vd-fW6hO2d6AXw=s2048?key=KGJRlJEPx4yrODZB1IsOdA'),
            ('assets/parallel-transport.png', [1448,1086], '1f43ec5335ce4d9c6d6c8397ae25dd9f9b81cf9439825be8f63d4d7fdd282b2d', 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXfw6RpbqbeRBtBAy5bzezkebC_fEvaR_exRHzZOGccJnmD2ZtiSrgHUKG76Zrn2rfAesnhupwaKM56Aikc63ItCaWw8ZBnPJLU-Eue9UzF0hexp_eK1rqLtuCVmmBkhK75CYOL4VEcEGvQOnYKIMn8kK0Dtex5_uIPEJ8ivkZ2b719hO2c=s2048?key=KGJRlJEPx4yrODZB1IsOdA'),
            ('assets/drosophila-transformer.png', [1536,1024], 'dfb41c6925bbcd61fde69e729dcb8aa96a0683e09e9fcc477fe1838a5caa5ca4', 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXcsBy-i-pKND59ZTrl8LnfNr4rAooZg5EdPCtICMQe-sUeOAUqdIKlNCuc0mmfte0Oy-PsB4PMq2fVdctib60e6b7BVcmU6V4nNQ_EljbmJnPEgSS8Gn21pqng3iKMqWVnQsTOb-nbgcwX1qd0IcBm-EPWC0-6oXMEeJU24ObojPmdlaDg=s2048?key=KGJRlJEPx4yrODZB1IsOdA'),
            ('assets/singularity.png', [1448,1086], '1fe8068202f85ca1ee3864862a5f835863fb08f7d1f31cace20fc820231aefc2', 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXeQ8ZVRnKfGlTzoNxdiYisji3TeIFvRmbwgfWKYhyPgb9ibRxd70Fdvl6unX2CofI54fPab1LoTf5sdmsw3xvaIqc5IKCX5sFF_UriN7pViEaoDQs4FaXf1cPad5ZA3Kg4X_jfVWQJQdY3wZyGUdcV7dKAQoPExmykG-MXqg1zxa9VFuvA=s2048?key=KGJRlJEPx4yrODZB1IsOdA'),
            ('assets/attention-in-flatland.png', [1448,1086], '9bd0037d5a9a1be09d4eaf64725266e9fc0b3a82b5914c175e7baef385c1d60e', 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXe0eCbZvAfEDnJJf9X2Epid0ycoHUhV1uzpTvAUqX7VSj0fsFPmyF1VTWR0D92Pij_w2DGwvaQ6L_KBpJSNPXSLpSLfF3QoK_CZ08illAwq6gxafk9OgHVD1L1NfdmqaR72A2owqkUG20jx-jL6CK_OAssFycivbEQ0fvDPABH7NtY0LGA=s2048?key=KGJRlJEPx4yrODZB1IsOdA'),
            ('assets/bent-paths-flat-spaces.png', [1448,1086], 'bee1f4af20edd7fc71beeab171479ab9e5f61758938ee09257d5ad8c94ef77e0', 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXenligNDzjtVJhb30MbUqMQzPwTWCWhe5bcvKguD-zGDqRD8C0_Xtydz4frXzi_9-XX7jZbqED863LbJWytrvA6hG41yFGAytu-WV0c9o75DECNSioJ-X3yWG72XjMwSsFjHQMWoi5bHUOSNn4GxcJ1_FpqqJewBghYSwnSb0BXhzDvX_c=s2048?key=KGJRlJEPx4yrODZB1IsOdA'),
          ]
          def api(path, payload=None, method=None):
              request = urllib.request.Request('https://api.github.com/repos/'+repo+path, data=None if payload is None else json.dumps(payload).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json', 'User-Agent':'article-image-import'}, method=method)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          blobs, manifest = [], []
          for path, size, pixel_hash, url in images:
              request = urllib.request.Request(url, headers={'User-Agent':'article-image-import'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read(20000001)
              assert len(data) <= 20000000, 'Oversized image: '+path
              with Image.open(io.BytesIO(data)) as im:
                  assert list(im.size) == size, 'Dimensions differ: '+path
                  actual = hashlib.sha256(im.convert('RGB').tobytes()).hexdigest()
                  assert actual == pixel_hash, 'Source pixels differ: '+path
                  if im.format != 'PNG':
                      output = io.BytesIO()
                      im.save(output, format='PNG')
                      data = output.getvalue()
              blob = api('/git/blobs', {'encoding':'base64','content':base64.b64encode(data).decode()})
              blobs.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
              manifest.append({'path':path,'size':size,'rgb_sha256':actual,'file_sha256':hashlib.sha256(data).hexdigest(),'git_blob_sha':blob['sha'],'bytes':len(data)})
              print('Verified', path, size, blob['sha'])
          blobs.append({'path':'assets/manifest.json','mode':'100644','type':'blob','content':json.dumps(manifest,indent=2)+'\n'})
          # Read main immediately before committing. Never force-push or replace other content.
          head = api('/git/ref/heads/main')['object']['sha']
          base_tree = api('/git/commits/'+head)['tree']['sha']
          tree = api('/git/trees', {'base_tree':base_tree,'tree':blobs})
          commit = api('/git/commits', {'message':'Save all eight article illustrations as verified repository PNGs','tree':tree['sha'],'parents':[head]})
          api('/git/refs/heads/main', {'sha':commit['sha'],'force':False}, method='PATCH')
          print('Committed all eight illustrations:',commit['sha'])
          PY
